<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Host detail — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
<h1 th:text="${host.name}">Host</h1>
<dl class="card">
  <dt>Department</dt><dd th:text="${host.department}">Department</dd>
  <dt>Phone</dt><dd th:text="${host.phone}">Phone</dd>
  <dt>Email</dt><dd th:text="${host.email}">Email</dd>
</dl>
<p class="actions-row">
  <a class="btn" th:href="@{/admin/hosts/{id}/edit(id=${host.hostId})}">Edit</a>
  <a th:href="@{/admin/hosts}">Back to list</a>
</p>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
