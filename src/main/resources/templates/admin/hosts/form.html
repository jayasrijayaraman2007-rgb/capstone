<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title th:text="${formTitle}">Host form</title></head>
<body>
<h1 th:text="${formTitle}">Host form</h1>
<form th:action="${formAction}" th:object="${host}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div>
    <label for="name">Name (required)</label>
    <input id="name" th:field="*{name}" type="text" required/>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>
  </div>
  <div>
    <label for="department">Department (required)</label>
    <input id="department" th:field="*{department}" type="text" required/>
    <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}">Department error</span>
  </div>
  <div>
    <label for="phone">Phone</label>
    <input id="phone" th:field="*{phone}" type="tel"/>
    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</span>
  </div>
  <div>
    <label for="email">Email</label>
    <input id="email" th:field="*{email}" type="email"/>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>
  </div>
  <div>
    <label for="accountId">Linked login account (optional)</label>
    <select id="accountId" name="accountId">
      <option value="">-- no linked account --</option>
      <option th:each="u : ${hostUsers}" th:value="${u.userId}" th:text="${u.username}"
        th:selected="${accountId == u.userId.toString()}">user</option>
    </select>
  </div>
  <button type="submit">Save</button>
  <a th:href="@{/admin/hosts}">Cancel</a>
</form>
</body>
</html>
