<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Hosts — Visitor Gate Pass</title></head>
<body>
<h1>Hosts</h1>
<form th:action="@{/admin/hosts}" method="get">
  <label for="q">Search by name</label>
  <input id="q" name="q" type="search" th:value="${q}"/>
  <button type="submit">Search</button>
</form>
<p><a th:href="@{/admin/hosts/new}">Add host</a></p>
<p th:if="${#lists.isEmpty(hosts)}">No hosts found.</p>
<div class="table-scroll">
<table th:unless="${#lists.isEmpty(hosts)}">
  <thead><tr><th scope="col">Name</th><th scope="col">Department</th><th scope="col">Email</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
  <tbody>
    <tr th:each="h : ${hosts}">
      <td th:text="${h.name}">Name</td>
      <td th:text="${h.department}">Department</td>
      <td th:text="${h.email}">Email</td>
      <td><a th:href="@{/admin/hosts/{id}(id=${h.hostId})}">View</a></td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
