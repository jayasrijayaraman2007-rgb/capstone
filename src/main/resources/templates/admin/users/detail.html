<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>User detail — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container">
<p class="page-eyebrow">Administration</p>
<h1 th:text="${user.name}">User</h1>
<div class="alert" th:if="${param.created}">✓ Employee account created successfully.</div>
<div class="alert alert-error" th:if="${param.error}">You cannot change your own account status.</div>
<dl class="card">
  <dt>Full Name</dt><dd th:text="${user.name}">Name</dd>
  <dt>Employee ID</dt><dd th:text="${user.employeeId}">ID</dd>
  <dt>Username</dt><dd class="mono" th:text="${user.username}">username</dd>
  <dt>Email</dt><dd th:text="${user.email}">Email</dd>
  <dt>Phone</dt><dd th:text="${user.phone}">Phone</dd>
  <dt>Department</dt><dd th:text="${user.department}">Dept</dd>
  <dt>Designation</dt><dd th:text="${user.designation}">Designation</dd>
  <dt>Role</dt><dd th:text="${user.role}">Role</dd>
  <dt>Status</dt><dd><span class="badge" th:classappend="${user.status.name() == 'ACTIVE' ? 'b-active' : 'b-rejected'}" th:text="${user.status}">Status</span></dd>
  <dt>Created</dt><dd th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">Created</dd>
</dl>
<div class="actions-row">
  <a class="btn btn-secondary" th:href="@{/admin/users/{id}/edit(id=${user.userId})}">Edit</a>
  <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/deactivate(id=${user.userId})}" method="post" onsubmit="return confirm('Deactivate this account? The user will be unable to log in.');">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn btn-danger">Deactivate</button>
  </form>
  <form th:if="${user.status.name() == 'INACTIVE'}" th:action="@{/admin/users/{id}/activate(id=${user.userId})}" method="post" onsubmit="return confirm('Activate this account?');">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn">Activate</button>
  </form>
  <a th:href="@{/admin/users}">Back to users</a>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
