<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Users — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container wide">
<p class="page-eyebrow">Administration</p>
<h1>Users</h1>
<p><a class="btn" th:href="@{/admin/users/new}">Create Account</a></p>
<p th:if="${#lists.isEmpty(users)}">No users found.</p>
<div class="table-scroll" th:unless="${#lists.isEmpty(users)}">
<table>
  <thead><tr><th scope="col">Name</th><th scope="col">Username</th><th scope="col">Role</th><th scope="col">Employee ID</th><th scope="col">Department</th><th scope="col">Status</th><th scope="col">Created</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
  <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.name}">Name</td>
      <td class="mono" th:text="${u.username}">username</td>
      <td th:text="${u.role}">Role</td>
      <td class="mono" th:text="${u.employeeId}">ID</td>
      <td th:text="${u.department}">Dept</td>
      <td><span class="badge" th:classappend="${u.status.name() == 'ACTIVE' ? 'b-active' : 'b-rejected'}" th:text="${u.status}">Status</span></td>
      <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">Created</td>
      <td><a th:href="@{/admin/users/{id}(id=${u.userId})}">View</a></td>
    </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
