<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Create Account — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container">
<p class="page-eyebrow">Administration</p>
<h1>Create Account</h1>
<p class="muted">Create and manage authorized users of the Visitor Management System.</p>
<div class="cards">
  <div class="card">
    <h2>👤 Employee / Host</h2>
    <p class="muted">Create an employee/host account.</p>
    <a class="btn" th:href="@{/admin/users/new(type='host')}">Create host account</a>
  </div>
  <div class="card">
    <h2>🛡 Security Officer</h2>
    <p class="muted">Create a security officer account.</p>
    <a class="btn" th:href="@{/admin/users/new(type='security')}">Create security account</a>
  </div>
</div>
<p><a th:href="@{/admin/users}">Back to users</a></p>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
