<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Change Password — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container">
<p class="page-eyebrow">Account</p>
<h1>Change Password</h1>
<div class="card">
<div class="alert" th:if="${changed}">✓ Password changed successfully.</div>
<div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</div>
<form th:action="@{/account/password}" th:object="${passwordForm}" method="post" id="change-form">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div>
    <label for="currentPassword">Current Password</label>
    <input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password" required/>
  </div>
  <div class="alert" th:text="'Password requirements: ' + ${policy}">Requirements</div>
  <div>
    <label for="password">New Password</label>
    <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required
      pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{1,8}$"
      title="At least 1 uppercase letter, at least 1 digit, at least 1 special character, maximum 8 characters."/>
  </div>
  <div>
    <label for="confirmPassword">Confirm New Password</label>
    <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required/>
    <span id="match-error" class="alert alert-error" hidden="hidden">Passwords do not match.</span>
  </div>
  <p><input id="showpw" type="checkbox"/> <label for="showpw">Show passwords</label></p>
  <button type="submit" class="btn">Change password</button>
  <a th:href="@{/dashboard}">Cancel</a>
</form>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
<script>
(function () {
  var pw = document.getElementById('password');
  var confirm = document.getElementById('confirmPassword');
  var err = document.getElementById('match-error');
  var show = document.getElementById('showpw');
  var form = document.getElementById('change-form');
  if (!pw || !confirm || !form) { return; }
  function check() {
    var mismatch = confirm.value && pw.value !== confirm.value;
    err.hidden = !mismatch;
    return !mismatch;
  }
  confirm.addEventListener('input', check);
  pw.addEventListener('input', check);
  show.addEventListener('change', function () {
    var type = show.checked ? 'text' : 'password';
    document.getElementById('currentPassword').type = type;
    pw.type = type;
    confirm.type = type;
  });
  form.addEventListener('submit', function (e) { if (!check()) { e.preventDefault(); } });
})();
</script>
</body>
</html>
