<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Dashboard — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container wide">
<h1>Dashboard</h1>
<p>Welcome, <span th:text="${username}">user</span>.</p>
<section>
  <h2>Overview</h2>
  <div class="cards">
    <div class="card"><span class="card-value" th:text="${totalVisitors}">0</span><span class="card-label">Total visitors</span></div>
    <div class="card"><span class="card-value" th:text="${pendingRequests}">0</span><span class="card-label">Pending requests</span></div>
    <div class="card"><span class="card-value" th:text="${approvedRequests}">0</span><span class="card-label">Approved requests</span></div>
    <div class="card"><span class="card-value" th:text="${insideNow}">0</span><span class="card-label">Inside now</span></div>
    <div class="card"><span class="card-value" th:text="${completedVisits}">0</span><span class="card-label">Completed visits</span></div>
  </div>
</section>
<section>
  <h2>Recent gate passes</h2>
  <p th:if="${#lists.isEmpty(recentPasses)}">No gate passes yet.</p>
  <ul th:unless="${#lists.isEmpty(recentPasses)}">
    <li th:each="p : ${recentPasses}">
      <a th:href="@{/passes/{id}(id=${p.passId})}" th:text="${'Pass #' + p.passId}">Pass</a>
      <span th:text="${p.visitor.name}">Visitor</span>
      <span class="badge" th:classappend="${'b-' + #strings.toLowerCase(p.status)}" th:text="${p.status}">Status</span>
    </li>
  </ul>
</section>
<section>
  <h2>Recent visit requests</h2>
  <p th:if="${#lists.isEmpty(recentRequests)}">No visit requests yet.</p>
  <ul th:unless="${#lists.isEmpty(recentRequests)}">
    <li th:each="r : ${recentRequests}">
      <a th:href="@{/requests/{id}(id=${r.requestId})}" th:text="${'Request #' + r.requestId}">Request</a>
      <span th:text="${r.visitor.name}">Visitor</span>
      <span class="badge" th:classappend="${'b-' + #strings.toLowerCase(r.status)}" th:text="${r.status}">Status</span>
    </li>
  </ul>
</section>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
