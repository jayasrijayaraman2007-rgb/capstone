<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <title th:text="${title}">Visitor Gate Pass</title>
</head>
<body>
<header th:fragment="topbar" class="topbar">
  <div class="topbar-inner">
    <a class="brand" th:href="@{/dashboard}">Gate Pass</a>
    <nav sec:authorize="isAuthenticated()">
      <a th:href="@{/dashboard}">Dashboard</a>
      <a sec:authorize="hasAnyRole('ADMIN','SECURITY_OFFICER')" th:href="@{/visitors}">Visitors</a>
      <a th:href="@{/requests}">Requests</a>
      <a sec:authorize="hasAnyRole('ADMIN','SECURITY_OFFICER')" th:href="@{/passes}">Passes</a>
      <a sec:authorize="hasAnyRole('ADMIN','SECURITY_OFFICER')" th:href="@{/history}">History</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/hosts}">Hosts</a>
    </nav>
    <div class="topbar-user" sec:authorize="isAuthenticated()">
      <span sec:authentication="name">user</span>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-ghost">Logout</button>
      </form>
    </div>
  </div>
</header>
<footer th:fragment="footer" class="footer">
  <span>Visitor Entry &amp; Gate Pass Management System — Capstone Project 126</span>
</footer>
</body>
</html>
