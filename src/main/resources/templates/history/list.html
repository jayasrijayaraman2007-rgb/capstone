<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Visit history — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container wide">
<p class="page-eyebrow">Audit trail</p>
<h1>Visit history</h1>
<form th:action="@{/history}" method="get">
  <label for="hq">Search visitor, phone, host, or pass</label>
  <input id="hq" name="q" type="search" th:value="${q}"/>
  <label for="hstatus">Status</label>
  <select id="hstatus" name="status">
    <option value="">All statuses</option>
    <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
    <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
    <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Completed</option>
  </select>
  <button type="submit" class="btn">Search</button>
</form>
<p th:if="${#lists.isEmpty(records)}">No entry or exit records yet.</p>
<div class="table-scroll" th:unless="${#lists.isEmpty(records)}">
<table>
  <thead><tr><th scope="col">Pass</th><th scope="col">Visitor</th><th scope="col">Host</th><th scope="col">Entry</th><th scope="col">Exit</th><th scope="col">Status</th></tr></thead>
  <tbody>
    <tr th:each="r : ${records}">
      <td><a th:href="@{/passes/{id}(id=${r.pass.passId})}" th:text="${r.pass.passId}">ID</a></td>
      <td th:text="${r.pass.visitor.name}">Visitor</td>
      <td th:text="${r.pass.host.name}">Host</td>
      <td th:text="${r.entryTime}">Entry</td>
      <td th:text="${r.exitTime}">Exit</td>
      <td><span class="badge" th:classappend="${'b-' + #strings.toLowerCase(r.pass.status)}" th:text="${r.pass.status}">Status</span></td>
    </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
