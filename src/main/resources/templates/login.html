<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Sign in — Sovereign Gate</title></head>
<body class="login-page">
<main class="login-split">
  <section class="login-brand">
    <p class="page-eyebrow">Sovereign Gate</p>
    <h1>Visitor Entry &amp; Gate Pass Management</h1>
    <ul>
      <li>Secure.</li>
      <li>Verified.</li>
      <li>Traceable.</li>
    </ul>
    <p class="muted">Authorized personnel only. All access is logged.</p>
  </section>
  <section class="login-form">
    <div class="card auth-card">
      <h2>Sign in</h2>
      <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
      <div class="alert" th:if="${param.logout}">You have been logged out.</div>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required/>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required/>
          <p><input id="showpw" type="checkbox" onclick="var p = document.getElementById('password'); p.type = this.checked ? 'text' : 'password';"/> <label for="showpw">Show password</label></p>
        </div>
        <button type="submit" class="btn btn-block">Sign in</button>
      </form>
      <p><a th:href="@{/login/admin}">Admin? Sign in with email code</a></p>
    </div>
  </section>
</main>
</body>
</html>
