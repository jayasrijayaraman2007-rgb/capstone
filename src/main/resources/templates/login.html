<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Login — Visitor Gate Pass</title></head>
<body>
<main class="container">
<div class="card auth-card">
<h1>Visitor Gate Pass</h1>
<div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
<div class="alert" th:if="${param.logout}">You have been logged out.</div>
<form th:action="@{/login}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required/>
  </div>
  <div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
  </div>
  <button type="submit" class="btn">Login</button>
</form>
</div>
</main>
</body>
</html>
