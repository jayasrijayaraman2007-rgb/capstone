<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Gate passes — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container wide">
<p class="page-eyebrow">Gate desk operations</p>
<h1>Arrival Queue &amp; Gate Clearance</h1>
<div class="chips" role="group" aria-label="Filter passes by status">
  <a class="chip" th:classappend="${status == '' ? ' chip-on' : ''}" th:href="@{/passes}">All Records <strong th:text="${totalPasses}">0</strong></a>
  <a class="chip" th:classappend="${status == 'APPROVED' ? ' chip-on' : ''}" th:href="@{/passes(status='APPROVED')}">Ready for Check-In <strong th:text="${counts.APPROVED}">0</strong></a>
  <a class="chip" th:classappend="${status == 'ACTIVE' ? ' chip-on' : ''}" th:href="@{/passes(status='ACTIVE')}">Currently Inside <strong th:text="${counts.ACTIVE}">0</strong></a>
  <a class="chip" th:classappend="${status == 'COMPLETED' ? ' chip-on' : ''}" th:href="@{/passes(status='COMPLETED')}">Completed <strong th:text="${counts.COMPLETED}">0</strong></a>
</div>
<p th:if="${#lists.isEmpty(passes)}">No gate passes found.</p>
<div class="table-scroll" th:unless="${#lists.isEmpty(passes)}">
<table>
  <thead><tr><th scope="col">Pass</th><th scope="col">Visitor</th><th scope="col">Host</th><th scope="col">Purpose</th><th scope="col">Gate State</th><th scope="col"><span class="visually-hidden">Rapid action</span></th></tr></thead>
  <tbody>
    <tr th:each="p : ${passes}">
      <td class="mono" th:text="${'GP-' + p.passId}">GP-0</td>
      <td th:text="${p.visitor.name}">Visitor</td>
      <td th:text="${p.host.name}">Host</td>
      <td th:text="${p.purpose}">Purpose</td>
      <td><span class="badge" th:classappend="${'b-' + #strings.toLowerCase(p.status)}" th:text="${p.status}">Status</span></td>
      <td>
        <form th:if="${p.status.name() == 'APPROVED'}" th:action="@{/passes/{id}/entry(id=${p.passId})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-micro">Fast Check-In</button>
        </form>
        <form th:if="${p.status.name() == 'ACTIVE'}" th:action="@{/passes/{id}/exit(id=${p.passId})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-micro">Check-Out</button>
        </form>
        <a th:href="@{/passes/{id}(id=${p.passId})}">View</a>
      </td>
    </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
