<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Gate passes — Visitor Gate Pass</title></head>
<body>
<h1>Gate passes</h1>
<p>
  <a th:href="@{/passes}">All</a>
  <a th:href="@{/passes(status='APPROVED')}">Approved</a>
  <a th:href="@{/passes(status='ACTIVE')}">Active</a>
  <a th:href="@{/passes(status='COMPLETED')}">Completed</a>
</p>
<p th:if="${#lists.isEmpty(passes)}">No gate passes found.</p>
<div class="table-scroll">
<table th:unless="${#lists.isEmpty(passes)}">
  <thead><tr><th scope="col">Pass</th><th scope="col">Visitor</th><th scope="col">Host</th><th scope="col">Purpose</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
  <tbody>
    <tr th:each="p : ${passes}">
      <td th:text="${p.passId}">ID</td>
      <td th:text="${p.visitor.name}">Visitor</td>
      <td th:text="${p.host.name}">Host</td>
      <td th:text="${p.purpose}">Purpose</td>
      <td th:text="${p.status}">Status</td>
      <td><a th:href="@{/passes/{id}(id=${p.passId})}">View</a></td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
