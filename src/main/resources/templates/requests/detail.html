<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Request detail — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
<h1>Visit request</h1>
<div class="alert alert-error" th:if="${param.error}">This request was already decided and cannot be changed.</div>
<dl class="card">
  <dt>Visitor</dt><dd th:text="${visitRequest.visitor.name}">Visitor</dd>
  <dt>Host</dt><dd th:text="${visitRequest.host.name}">Host</dd>
  <dt>Purpose</dt><dd th:text="${visitRequest.purpose}">Purpose</dd>
  <dt>Requested</dt><dd th:text="${visitRequest.requestDate}">Date</dd>
  <dt>Status</dt><dd><span class="badge" th:classappend="${'b-' + #strings.toLowerCase(visitRequest.status)}" th:text="${visitRequest.status}">Status</span></dd>
</dl>
<div th:if="${existingPass != null}">
  <a class="btn" th:href="@{/passes/{id}(id=${existingPass.passId})}">View gate pass</a>
</div>
<div th:if="${visitRequest.status.name() == 'APPROVED' and existingPass == null}" sec:authorize="hasAnyRole('ADMIN','SECURITY_OFFICER')">
  <form th:action="@{/requests/{id}/pass(id=${visitRequest.requestId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn">Generate gate pass</button>
  </form>
</div>
<div class="actions-row" th:if="${visitRequest.status.name() == 'PENDING'}">
  <form th:action="@{/requests/{id}/approve(id=${visitRequest.requestId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn">Approve</button>
  </form>
  <form th:action="@{/requests/{id}/reject(id=${visitRequest.requestId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" class="btn btn-danger">Reject</button>
  </form>
</div>
<p><a th:href="@{/requests}">Back to list</a></p>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
