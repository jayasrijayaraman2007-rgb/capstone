<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Visit requests — Visitor Gate Pass</title></head>
<body>
<h1>Visit requests</h1>
<p>
  <a th:href="@{/requests}">All</a>
  <a th:href="@{/requests(status='PENDING')}">Pending</a>
  <a th:href="@{/requests(status='APPROVED')}">Approved</a>
  <a th:href="@{/requests(status='REJECTED')}">Rejected</a>
</p>
<p th:if="${#lists.isEmpty(requests)}">No visit requests found.</p>
<div class="table-scroll">
<table th:unless="${#lists.isEmpty(requests)}">
  <thead><tr><th scope="col">Visitor</th><th scope="col">Host</th><th scope="col">Purpose</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
  <tbody>
    <tr th:each="r : ${requests}">
      <td th:text="${r.visitor.name}">Visitor</td>
      <td th:text="${r.host.name}">Host</td>
      <td th:text="${r.purpose}">Purpose</td>
      <td th:text="${r.status}">Status</td>
      <td><a th:href="@{/requests/{id}(id=${r.requestId})}">View</a></td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
