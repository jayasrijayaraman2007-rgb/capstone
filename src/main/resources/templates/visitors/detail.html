<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" th:href="@{/css/app.css}"/><title>Visitor detail — Visitor Gate Pass</title></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<div class="shell-main">
<div th:replace="~{fragments :: pagehead}"></div>
<main class="container">
<h1 th:text="${visitor.name}">Visitor</h1>
<dl class="card">
  <dt>Phone</dt><dd th:text="${visitor.phone}">Phone</dd>
  <dt>Email</dt><dd th:text="${visitor.email}">Email</dd>
  <dt>Address</dt><dd th:text="${visitor.address}">Address</dd>
  <dt>ID proof</dt><dd th:text="${visitor.idProof}">ID proof</dd>
</dl>
<p class="actions-row">
  <a class="btn" th:href="@{/visitors/{id}/edit(id=${visitor.visitorId})}">Edit</a>
  <a th:href="@{/visitors}">Back to list</a>
</p>
</main>
<div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
