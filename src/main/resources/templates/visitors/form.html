<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${formTitle}">Visitor form</title></head>
<body>
<h1 th:text="${formTitle}">Visitor form</h1>
<form th:action="${formAction}" th:object="${visitor}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div>
    <label for="name">Name (required)</label>
    <input id="name" th:field="*{name}" type="text" required/>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>
  </div>
  <div>
    <label for="phone">Phone (required)</label>
    <input id="phone" th:field="*{phone}" type="tel" required/>
    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</span>
  </div>
  <div>
    <label for="email">Email</label>
    <input id="email" th:field="*{email}" type="email"/>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>
  </div>
  <div>
    <label for="address">Address</label>
    <input id="address" th:field="*{address}" type="text"/>
    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address error</span>
  </div>
  <div>
    <label for="idProof">ID proof (required)</label>
    <input id="idProof" th:field="*{idProof}" type="text" required/>
    <span th:if="${#fields.hasErrors('idProof')}" th:errors="*{idProof}">ID proof error</span>
  </div>
  <button type="submit">Save</button>
  <a th:href="@{/visitors}">Cancel</a>
</form>
</body>
</html>
